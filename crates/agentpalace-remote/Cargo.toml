[package]
name = "agentpalace-remote"
description = "HTTP client for the AgentPalace federation REST API."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1.89"
agentpalace-config = { path = "../agentpalace-config" }
agentpalace-federation = { path = "../agentpalace-federation" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.48.0", features = ["io-util", "net", "sync", "time"] }
tracing.workspace = true
base64 = "0.22.1"
keyring = "3.6.3"
rand = "0.9.2"
sha2 = "0.10.9"

[dev-dependencies]
axum = { version = "0.8", default-features = true }
agentpalace-core = { path = "../agentpalace-core" }
agentpalace-embeddings = { path = "../agentpalace-embeddings" }
agentpalace-server = { path = "../agentpalace-server" }
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "sync"] }

[lints]
workspace = true

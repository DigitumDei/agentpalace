[package]
name = "agentpalace-demo-hub"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Fail-closed authorization gateway foundation for the local AgentPalace demo hub."

[dependencies]
agentpalace-core = { path = "../agentpalace-core" }
axum = { version = "0.8", default-features = true }
base64 = "0.22.1"
blake3.workspace = true
jsonwebtoken = "9.3.1"
rand = "0.9.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
thiserror.workspace = true
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread"] }

[dev-dependencies]
agentpalace-remote = { path = "../agentpalace-remote" }
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
